name: TPV V2 CI

on:
  push:
    branches: ["v2-hybrid-architecture"]
  pull_request:
    branches: ["v2-hybrid-architecture"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tpv_test
          POSTGRES_USER: tpv_test
          POSTGRES_PASSWORD: tpv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpv_test -d tpv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tpv_test:tpv_test@localhost:5432/tpv_test
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Import application and register schema
        run: python -c "from app.main import app; from app.models import Base; print(app.title, len(Base.metadata.tables))"
      - name: Apply database migrations
        run: alembic -c ../alembic.ini upgrade head
