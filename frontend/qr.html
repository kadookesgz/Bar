<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a2b"><title>Carta digital</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172033;font:15px/1.5 system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:20px}.head{background:#111a2b;color:white;padding:24px;border-radius:0 0 18px 18px;margin:-20px -20px 20px}.head small{color:#b7c4d7;letter-spacing:1.5px}.head h1{margin:7px 0 0}.items{display:grid;gap:10px}.item{background:white;border:1px solid #e4e8ef;border-radius:13px;padding:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item p{margin:4px 0 0;color:#718096;font-size:13px}.item button,.submit{border:0;border-radius:10px;background:#2463eb;color:white;padding:10px 14px;font-weight:700}.cart{position:sticky;bottom:0;background:white;border:1px solid #e4e8ef;border-radius:15px;padding:15px;margin-top:20px;box-shadow:0 4px 20px #17203318}.cartrow{display:flex;justify-content:space-between;padding:6px 0}.submit{width:100%;margin-top:10px}.muted{color:#718096}.error{background:#fff1f1;color:#a33;padding:15px;border-radius:10px}
</style></head><body><div class="wrap"><header class="head"><small>CARTA DIGITAL</small><h1 id="venue">Cargando carta…</h1><div id="table" style="color:#c5d0e0"></div></header><div id="error"></div><div id="items" class="items"></div><section class="cart"><strong>Tu pedido</strong><div id="cart"><p class="muted">Todavía no has añadido productos.</p></div><div class="cartrow"><b>Total</b><b id="total">0,00 €</b></div><button class="submit" id="send" disabled>Enviar pedido a cocina</button><p class="muted" style="font-size:11px;margin-bottom:0">El pago se realiza posteriormente en el establecimiento.</p></section></div>
<script>
const token=location.pathname.split("/").filter(Boolean).pop();let menu=null,cart={};
const money=n=>new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){try{const r=await fetch("/api/v1/public/qr/"+encodeURIComponent(token));menu=await r.json();if(!r.ok)throw new Error(menu.detail||"Código QR no válido");document.getElementById("venue").textContent="Carta del establecimiento";document.getElementById("table").textContent=menu.table.label;document.getElementById("items").innerHTML=menu.products.map(p=>'<article class="item"><div><b>'+esc(p.name)+'</b><p>'+esc(p.description||"")+'</p><p>Alérgenos: '+esc((p.allergens||[]).join(", ")||"No indicados")+'</p><b>'+money(p.price)+'</b></div><button onclick="add(\\''+p.id+'\\')">Añadir</button></article>').join("")||'<p class="muted">No hay productos disponibles.</p>';}catch(e){document.getElementById("error").innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function add(id){cart[id]=(cart[id]||0)+1;render()}
function render(){let total=0;const lines=Object.entries(cart).map(([id,qty])=>{const p=menu.products.find(x=>x.id===id);const value=Number(p.price)*qty;total+=value;return '<div class="cartrow"><span>'+esc(p.name)+' × '+qty+'</span><b>'+money(value)+'</b></div>'});document.getElementById("cart").innerHTML=lines.join("")||'<p class="muted">Todavía no has añadido productos.</p>';document.getElementById("total").textContent=money(total);document.getElementById("send").disabled=!lines.length}
document.getElementById("send").onclick=async()=>{try{const lines=Object.entries(cart).map(([product_id,quantity])=>({product_id,quantity}));const r=await fetch("/api/v1/public/qr/"+encodeURIComponent(token)+"/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lines})});const data=await r.json();if(!r.ok)throw new Error(data.detail||"No se pudo enviar el pedido");document.querySelector(".cart").innerHTML='<h2>¡Pedido enviado!</h2><p>Comanda número <b>#'+data.order_number+'</b></p><p>Total: <b>'+money(data.total)+'</b></p><p class="muted">El personal del establecimiento atenderá tu pedido.</p>';cart={}}catch(e){alert(e.message)}};
init();
</script></body></html>
